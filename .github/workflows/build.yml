name: Build APK

on:
  push:
    branches: [ "master", "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK structure
        run: |
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -n1)
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          "$AAPT" dump badging "$APK_PATH"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload to Appetize.io
        if: github.event_name != 'pull_request'
        env:
          APPETIZE_API_TOKEN: ${{ secrets.APPETIZE_API_TOKEN }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          RESPONSE=$(curl --silent --request POST \
            --url "https://api.appetize.io/v1/apps" \
            --header "X-API-KEY: $APPETIZE_API_TOKEN" \
            --form "file=@$APK_PATH" \
            --form "platform=android")
          echo "$RESPONSE"
          PUBLIC_KEY=$(echo "$RESPONSE" | grep -o '"publicKey":"[^"]*"' | head -n1 | cut -d'"' -f4)
          {
            echo "## Appetize.io preview"
            if [ -n "$PUBLIC_KEY" ]; then
              echo "Tap below to launch this exact build in an Android emulator, right in your browser:"
              echo ""
              echo "https://appetize.io/app/$PUBLIC_KEY"
            else
              echo "Upload to Appetize.io did not return a public key. Raw response:"
              echo '```'
              echo "$RESPONSE"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Scan APK with VirusTotal
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n1)
          SHA256=$(sha256sum "$APK_PATH" | awk '{print $1}')
          echo "Uploading $APK_PATH (sha256: $SHA256) to VirusTotal..."

          MAX_ATTEMPTS=3
          ATTEMPT=1
          while [ "$ATTEMPT" -le "$MAX_ATTEMPTS" ]; do
            HTTP_STATUS=$(curl --silent --output vt_response.json --write-out "%{http_code}" \
              --request POST \
              --url https://www.virustotal.com/api/v3/files \
              --header "x-apikey: $VT_API_KEY" \
              --form file=@"$APK_PATH")

            if [ "$HTTP_STATUS" = "429" ]; then
              echo "VirusTotal rate limit hit (attempt $ATTEMPT/$MAX_ATTEMPTS). Waiting 65 seconds before retrying..."
              sleep 65
              ATTEMPT=$((ATTEMPT + 1))
              continue
            fi

            break
          done

          cat vt_response.json
          {
            echo "## VirusTotal scan"
            echo "SHA256: \`$SHA256\`"
            echo ""
            echo "Report (scanning may take a minute or two to finish): https://www.virustotal.com/gui/file/$SHA256"
          } >> "$GITHUB_STEP_SUMMARY"
